services:
  - type: web
    name: portfolio-fullstack
    env: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_USERNAME
        value: srisarukumar
      - key: LEETCODE_USERNAME
        value: srisarukumar
